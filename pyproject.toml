[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anots"
version = "0.0.1"
description = "Domain-agnostic acoustic annotation workstation for building ML audio datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
gui = ["sounddevice>=0.4", "PyQt6>=6.6", "matplotlib>=3.8"]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["python_ref", "python_ref.dsp", "python_ref.validation"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
